services:
  - type: web
    name: tracking-guide
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn tracking_guide.wsgi --workers 2 --timeout 120 --max-requests 500 --max-requests-jitter 50 --access-logfile - --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tracking-guide-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false

  - type: cron
    name: cerrar-guias-vencidas
    env: python
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py cerrar_guias_vencidas
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: tracking-guide-db
          property: connectionString

  - type: cron
    name: resumen-semanal-transportistas
    env: python
    # 11:00 UTC ≈ 08:00 hora de Chile (varía ±1h según horario de verano/invierno).
    schedule: "0 11 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py enviar_resumen_semanal_transportistas
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: tracking-guide-db
          property: connectionString
      - key: MANDRILL_API_KEY
        sync: false
      - key: MANDRILL_FROM_EMAIL
        sync: false
      - key: LOGISTICS_EMAIL
        sync: false

databases:
  - name: tracking-guide-db
    databaseName: tracking_guide
    user: tracking_guide
